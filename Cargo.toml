[package]
name = "windman"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1.13"
portable-pty = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
plist = "1"
global-hotkey = "0.10"
fs2 = "0.4"
ghostty-vt = "0.9.0"
raw-window-handle = "0.6"
meval = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSRunningApplication", "NSGraphics", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject", "NSDictionary", "NSData"] }
